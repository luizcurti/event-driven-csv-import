directory:
  - terraform
compact: true
quiet: true
download-external-modules: false

# Each skip below is a deliberate, documented trade-off for this project's
# actual scale and requirements (a demo/portfolio serverless pipeline) —
# not an oversight. Re-evaluate if the project's requirements change.
skip-check:
  # Lambdas only call AWS-managed service APIs (S3, DynamoDB, SQS,
  # EventBridge, Step Functions, Lambda) over public AWS endpoints. A VPC
  # would add NAT Gateway cost and cold-start latency with no security
  # benefit here.
  - CKV_AWS_117 # Lambda function should be configured inside a VPC

  # Environment variables hold only resource names (bucket/table/queue),
  # never secrets. The default AWS-managed encryption at rest is sufficient.
  - CKV_AWS_173 # Lambda environment variable encryption with a customer-managed KMS key

  # Code signing requires standing up an AWS Signer signing profile and
  # pipeline step, disproportionate for this project's current zip-based
  # deploy process.
  - CKV_AWS_272 # Lambda code-signing validation

  # Retention is intentionally 14 days to control CloudWatch Logs storage
  # cost for a demo/portfolio workload — see README "Observability &
  # Resilience (AWS)". A year of logs isn't a requirement here.
  - CKV_AWS_338 # CloudWatch log group retention >= 1 year

  # Default AWS-managed encryption at rest is sufficient; these log groups
  # never contain secrets (see shared/logger.ts — structured JSON of
  # request metadata only).
  - CKV_AWS_158 # CloudWatch log group encrypted with a customer-managed KMS key

  # The stack has no Java runtime, so the Log4Shell (CVE-2021-44228) rule
  # doesn't apply.
  - CKV_AWS_192 # WAF WebACL should have a Log4j2 rule

  # Would require a Kinesis Firehose/CloudWatch destination just for the
  # WAF's own audit log. The existing CloudWatch alarms on the API Gateway
  # stage already cover the operational signal needed here.
  - CKV2_AWS_31 # WAFv2 web ACL logging configuration

  # Applies to mutual TLS on a custom domain name; this API is served from
  # the default execute-api domain.
  - CKV2_AWS_51 # API Gateway client certificate authentication

  # The imports bucket holds transient processing artifacts (source CSVs
  # and their chunks), not a system of record — the DynamoDB imports table
  # is the durable source of truth for an import's outcome. Versioning,
  # cross-region replication, KMS, and access logging on top of that would
  # be cost and complexity without a matching requirement.
  - CKV_AWS_144 # S3 bucket cross-region replication
  - CKV_AWS_145 # S3 bucket default encryption with KMS
  - CKV_AWS_21 # S3 bucket versioning
  - CKV_AWS_18 # S3 bucket access logging

  # Input validation is intentionally centralized once, in the Lambda
  # handlers (shared/validation.ts), as the single source of truth.
  # Duplicating the same rules as API Gateway JSON Schema request-validator
  # models would violate DRY without adding real protection.
  - CKV2_AWS_53 # API Gateway request validation

  # False positive: terraform/modules/waf already associates a WAFv2 Web
  # ACL with this stage (aws_wafv2_web_acl_association.api_gateway) for
  # real AWS deployments. Checkov's static graph doesn't resolve the
  # cross-module, conditionally-created (count = !use_localstack)
  # association.
  - CKV2_AWS_29 # API Gateway should be associated with a WAF

  # Default AWS-owned encryption at rest is already on for every DynamoDB
  # table; the imports table holds no secrets, so a customer-managed key
  # adds operational overhead (key policy, rotation) without a matching need.
  - CKV_AWS_119 # DynamoDB table encrypted with a customer-managed KMS key

  # Caching GET /imports and GET /imports/{id} would serve stale import
  # status to clients polling for completion — actively wrong for an API
  # whose entire purpose is to reflect an import's current state.
  - CKV_AWS_120 # API Gateway stage caching
  - CKV_AWS_225 # API Gateway method-settings caching

  # Intentional portfolio-project decision, not an oversight: this is a
  # public demo API with no authentication on any route, so the whole
  # Postman collection can be run against it with zero setup (see README
  # "API" section). Adding an authorizer would change the public API
  # contract — out of scope for an infrastructure hardening pass, and not
  # something to add just to satisfy a scanner.
  - CKV_AWS_59 # API Gateway method should not be open to the public without authorization

  # False positive: the stage already sets
  # `xray_tracing_enabled = !var.use_localstack`, which is `true` for every
  # real AWS deployment (use_localstack defaults to false). Checkov's static
  # analysis doesn't evaluate the boolean negation of a variable reference.
  - CKV_AWS_73 # API Gateway X-Ray tracing
