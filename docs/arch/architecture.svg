<svg viewBox="0 0 1260 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#687078"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1260" height="800" fill="#FFFFFF"/>

  <text x="630" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">Event Driven CSV Import — AWS Architecture (High-Level)</text>

  <!-- ===================== EDGES ===================== -->
  <g stroke="#687078" stroke-width="2" fill="none">
    <!-- client -> apigw -->
    <path d="M95,400 L195,400" marker-end="url(#arrow)"/>
    <!-- apigw -> upload -->
    <path d="M265,400 L265,220 L385,220" marker-end="url(#arrow)"/>
    <!-- apigw -> status -->
    <path d="M265,400 L265,580 L385,580" marker-end="url(#arrow)"/>
    <!-- upload -> s3 -->
    <path d="M420,185 L420,110 L585,110" marker-end="url(#arrow)"/>
    <!-- upload -> eventbridge -->
    <path d="M455,220 L585,220" marker-end="url(#arrow)"/>
    <!-- eventbridge -> split -->
    <path d="M655,220 L765,220" marker-end="url(#arrow)"/>
    <!-- split -> sqs -->
    <path d="M835,220 L945,220" marker-end="url(#arrow)"/>
    <!-- sqs -> worker -->
    <path d="M1015,220 L1125,220" marker-end="url(#arrow)"/>
    <!-- worker -> aggregator -->
    <path d="M1160,255 L1160,365" marker-end="url(#arrow)"/>
    <!-- aggregator -> dynamodb -->
    <path d="M1160,435 L1160,580 L835,580" marker-end="url(#arrow)"/>
    <!-- status -> dynamodb -->
    <path d="M455,580 L765,580" marker-end="url(#arrow)"/>
  </g>

  <g stroke="#C7102E" stroke-width="2" fill="none" stroke-dasharray="6,4">
    <!-- split -> dlq -->
    <path d="M800,255 L800,280 L700,280 L700,700 L945,700" marker-end="url(#arrow)"/>
    <!-- aggregator -> dlq -->
    <path d="M1195,400 L1220,400 L1220,700 L1015,700" marker-end="url(#arrow)"/>
  </g>

  <!-- ===================== EDGE LABELS ===================== -->
  <g font-size="11" fill="#232F3E">
    <text x="280" y="300">POST /imports</text>
    <text x="280" y="500">GET /imports/{id}</text>
    <text x="430" y="145">store file</text>
    <text x="480" y="212">trigger import</text>
    <text x="672" y="212">async invoke</text>
    <text x="852" y="212">enqueue chunks</text>
    <text x="1020" y="212">poll (parallel)</text>
    <text x="1168" y="312">async invoke</text>
    <text x="980" y="572">write results</text>
    <text x="565" y="572">read status</text>
    <text x="705" y="672" fill="#C7102E">on failure</text>
  </g>

  <!-- ===================== NODES ===================== -->

  <!-- Client -->
  <circle cx="60" cy="400" r="35" fill="#545B64"/>
  <circle cx="60" cy="389" r="7" fill="#FFFFFF"/>
  <path d="M45,418 Q60,398 75,418 L75,427 Q60,412 45,427 Z" fill="#FFFFFF"/>
  <text x="60" y="453" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Client</text>
  <text x="60" y="469" text-anchor="middle" font-size="10" fill="#687078">browser / API caller</text>

  <!-- API Gateway -->
  <rect x="195" y="365" width="70" height="70" rx="12" fill="#E7157B"/>
  <text x="230" y="407" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">API</text>
  <text x="230" y="453" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">API Gateway</text>
  <text x="230" y="469" text-anchor="middle" font-size="10" fill="#687078">no authentication</text>

  <!-- Upload Lambda -->
  <rect x="385" y="185" width="70" height="70" rx="12" fill="#ED7100"/>
  <text x="420" y="230" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">&#955;</text>
  <text x="420" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Upload &#955;</text>
  <text x="420" y="289" text-anchor="middle" font-size="10" fill="#687078">file validation</text>

  <!-- Status Lambda -->
  <rect x="385" y="545" width="70" height="70" rx="12" fill="#ED7100"/>
  <text x="420" y="590" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">&#955;</text>
  <text x="420" y="633" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Status &#955;</text>
  <text x="420" y="649" text-anchor="middle" font-size="10" fill="#687078">import lookup</text>

  <!-- S3 -->
  <rect x="585" y="75" width="70" height="70" rx="12" fill="#7AA116"/>
  <text x="620" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">S3</text>
  <text x="620" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">S3 Bucket</text>
  <text x="620" y="179" text-anchor="middle" font-size="10" fill="#687078">raw CSV files</text>

  <!-- EventBridge -->
  <rect x="585" y="185" width="70" height="70" rx="12" fill="#E7157B"/>
  <text x="620" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">EB</text>
  <text x="620" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">EventBridge</text>
  <text x="620" y="289" text-anchor="middle" font-size="10" fill="#687078">import event</text>

  <!-- Split Lambda -->
  <rect x="765" y="185" width="70" height="70" rx="12" fill="#ED7100"/>
  <text x="800" y="230" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">&#955;</text>
  <text x="800" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Split &#955;</text>
  <text x="800" y="289" text-anchor="middle" font-size="10" fill="#687078">chunk the CSV</text>

  <!-- SQS -->
  <rect x="945" y="185" width="70" height="70" rx="12" fill="#E7157B"/>
  <text x="980" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">SQS</text>
  <text x="980" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">SQS Queue</text>
  <text x="980" y="289" text-anchor="middle" font-size="10" fill="#687078">chunk queue</text>

  <!-- Worker Lambda (parallel) -->
  <rect x="1125" y="185" width="70" height="70" rx="12" fill="#ED7100"/>
  <text x="1160" y="230" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">&#955;</text>
  <circle cx="1189" cy="191" r="13" fill="#232F3E"/>
  <text x="1189" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">xN</text>
  <text x="1160" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Worker &#955;</text>
  <text x="1160" y="289" text-anchor="middle" font-size="10" fill="#687078">parallel processing</text>

  <!-- Aggregator Lambda -->
  <rect x="1125" y="365" width="70" height="70" rx="12" fill="#ED7100"/>
  <text x="1160" y="410" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">&#955;</text>
  <text x="1160" y="453" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Aggregator &#955;</text>
  <text x="1160" y="469" text-anchor="middle" font-size="10" fill="#687078">consolidate results</text>

  <!-- DynamoDB -->
  <rect x="765" y="545" width="70" height="70" rx="12" fill="#4D72F3"/>
  <text x="800" y="590" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">DDB</text>
  <text x="800" y="633" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">DynamoDB</text>
  <text x="800" y="649" text-anchor="middle" font-size="10" fill="#687078">status &amp; results</text>

  <!-- DLQ -->
  <rect x="945" y="665" width="70" height="70" rx="12" fill="#C7102E"/>
  <text x="980" y="710" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">DLQ</text>
  <text x="980" y="753" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Async Failures</text>
  <text x="980" y="769" text-anchor="middle" font-size="10" fill="#687078">Split &amp; Aggregator</text>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="12" fill="#232F3E">
    <rect x="20" y="595" width="270" height="185" rx="8" fill="#F8F8F8" stroke="#E1E4E8"/>
    <text x="36" y="620" font-size="13" font-weight="bold" fill="#232F3E">Legend</text>

    <rect x="36" y="633" width="16" height="16" rx="3" fill="#ED7100"/>
    <text x="60" y="646">Compute (Lambda)</text>

    <rect x="36" y="657" width="16" height="16" rx="3" fill="#7AA116"/>
    <text x="60" y="670">Storage (S3)</text>

    <rect x="36" y="681" width="16" height="16" rx="3" fill="#4D72F3"/>
    <text x="60" y="694">Database (DynamoDB)</text>

    <rect x="36" y="705" width="16" height="16" rx="3" fill="#E7157B"/>
    <text x="60" y="718">App Integration</text>

    <rect x="36" y="729" width="16" height="16" rx="3" fill="#C7102E"/>
    <text x="60" y="742">Dead Letter Queue</text>

    <line x1="36" y1="758" x2="66" y2="758" stroke="#687078" stroke-width="2"/>
    <text x="72" y="762" font-size="11">main flow</text>

    <line x1="36" y1="773" x2="66" y2="773" stroke="#C7102E" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="72" y="777" font-size="11">async failure</text>
  </g>
</svg>
