name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # "Run workflow" on main re-runs the full pipeline and deploys, e.g. to recreate the stack
  # after the Destroy workflow.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Format Check
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests (100% coverage gate)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=bootstrap fmt -check -recursive

      - name: Terraform Validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Terraform Lint (tflint)
        working-directory: terraform
        run: tflint --config "${{ github.workspace }}/terraform/.tflint.hcl" --recursive

      - name: Setup Python (for checkov)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Terraform Static Analysis (checkov)
        run: |
          pip install --quiet checkov
          checkov --config-file .checkov.yaml

  e2e-localstack:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Package Lambdas
        run: npm run package:lambdas

      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES=s3,dynamodb,sqs,sns,lambda,events,cloudwatch,logs,iam,kms,sts,apigateway \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            -e DEBUG=0 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            localstack/localstack:4.1.1

      - name: Wait for LocalStack Health
        run: curl -fsS http://localhost:4566/_localstack/health --retry 60 --retry-delay 2 --retry-all-errors --retry-connrefused > /dev/null

      - name: E2E Tests (LocalStack)
        run: npm run test:localstack

      - name: Deploy to LocalStack via Terraform
        run: |
          npm run terraform:init -- -input=false
          npm run terraform:apply -- -var use_localstack=true -auto-approve -input=false

      - name: API/Collection Tests (Postman via newman)
        run: npm run test:postman

      - name: Destroy Terraform-managed LocalStack Resources
        if: always()
        run: npm run terraform:destroy -- -var use_localstack=true -auto-approve -input=false

      - name: Stop LocalStack
        if: always()
        run: docker rm -f localstack

  # Deploys the stack to real AWS on every push to main (or manual run on main), once validate +
  # e2e-localstack pass. Auth is GitHub OIDC → IAM role (bootstrap/), so no AWS keys are stored in
  # GitHub. Configuration lives in the `production` GitHub environment (see README "Deploy to AWS
  # (GitHub Actions)"); until AWS_DEPLOY_ROLE_ARN is set there, the job skips the AWS steps and
  # stays green.
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate, e2e-localstack]
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      # false = no reserved concurrency. New AWS accounts start with a 10-execution account limit,
      # which leaves nothing to reserve (AWS keeps 10 unreserved). Once the account quota is
      # raised, set RESERVE_LAMBDA_CONCURRENCY=true in the production environment.
      TF_VAR_reserve_lambda_concurrency: ${{ vars.RESERVE_LAMBDA_CONCURRENCY || 'false' }}
      # The API Gateway CloudWatch role is an account+region-wide setting. Set this to false if
      # another stack in the same account/region already manages it.
      TF_VAR_manage_api_gateway_account_settings: ${{ vars.MANAGE_API_GATEWAY_ACCOUNT_SETTINGS || 'true' }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check deploy configuration
        id: config
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::notice title=Deploy skipped::AWS_DEPLOY_ROLE_ARN is not set in the production environment. See README → Deploy to AWS (GitHub Actions)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -z "$AWS_REGION" ] && missing="$missing AWS_REGION"
          [ -z "$STATE_BUCKET" ] && missing="$missing TF_STATE_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy misconfigured::Missing in the production environment:$missing"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Build and Package Lambda zip
        if: steps.config.outputs.enabled == 'true'
        run: |
          npm ci
          npm run package:lambdas

      - name: Configure AWS credentials (OIDC)
        if: steps.config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        if: steps.config.outputs.enabled == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # The S3 backend is only added here, at deploy time. Committing a backend block would
      # break the e2e-localstack job, which applies the same stack against LocalStack with
      # local state.
      - name: Terraform Init (S3 remote state)
        if: steps.config.outputs.enabled == 'true'
        working-directory: terraform
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          cat > ci_backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=event-driven-csv-import/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Plan
        if: steps.config.outputs.enabled == 'true'
        working-directory: terraform
        shell: bash # bash -eo pipefail, so `| tee` keeps Terraform's exit code
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.log

      - name: Terraform Apply
        if: steps.config.outputs.enabled == 'true'
        working-directory: terraform
        shell: bash # bash -eo pipefail, so `| tee` keeps Terraform's exit code
        run: terraform apply -input=false -no-color tfplan 2>&1 | tee apply.log

      # Surface each Terraform "Error:" block as a run annotation, so failures are readable
      # from the run summary / checks API without downloading the raw job log.
      - name: Report Terraform errors
        if: failure() && steps.config.outputs.enabled == 'true'
        working-directory: terraform
        run: |
          for f in plan.log apply.log; do
            [ -f "$f" ] || continue
            awk '{ gsub(/%/, "%25") }
                 /^Error: / { if (buf) print buf; buf = $0; n = 0; next }
                 buf && n < 15 { buf = buf "%0A" $0; n++ }
                 END { if (buf) print buf }' "$f" |
              while IFS= read -r block; do echo "::error title=Terraform ($f)::${block}"; done
          done

      - name: Smoke Test
        if: steps.config.outputs.enabled == 'true'
        run: |
          API_URL=$(terraform -chdir=terraform output -raw api_invoke_url)
          echo "API: ${API_URL}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "${API_URL}/imports")
          echo "GET /imports → ${code}"
          [ "$code" = "200" ] || { echo "::error::Expected 200 from GET /imports, got ${code}"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "${API_URL}/imports/00000000-0000-0000-0000-000000000000")
          echo "GET /imports/{unknown id} → ${code}"
          [ "$code" = "404" ] || { echo "::error::Expected 404 for an unknown import, got ${code}"; exit 1; }
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "API URL: ${API_URL}" >> "$GITHUB_STEP_SUMMARY"
