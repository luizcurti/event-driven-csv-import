name: Destroy

# Manually tears down the real AWS stack (terraform/) to stop paying for it while unused.
# Recreate it with the CI-CD workflow's "Run workflow" button (or any push to main).
# The one-time bootstrap/ resources (state bucket, OIDC provider, deploy role) are kept.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete every AWS resource of this stack (S3 imports and DynamoDB data included)'
        required: true
        type: string

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_reserve_lambda_concurrency: ${{ vars.RESERVE_LAMBDA_CONCURRENCY || 'false' }}
      TF_VAR_manage_api_gateway_account_settings: ${{ vars.MANAGE_API_GATEWAY_ACCOUNT_SETTINGS || 'true' }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error title=Not confirmed::Type exactly \"destroy\" to run this workflow."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      # modules/lambda hashes var.lambda_zip_path even on destroy; the code itself is irrelevant
      # here, so a placeholder avoids a full npm install + build.
      - name: Placeholder Lambda zip
        run: |
          mkdir -p terraform/build
          echo "placeholder for terraform destroy" > terraform/build/README.txt
          (cd terraform/build && zip -q lambda.zip README.txt)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-destroy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init (S3 remote state)
        working-directory: terraform
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          cat > ci_backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=event-driven-csv-import/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Destroy
        working-directory: terraform
        shell: bash # bash -eo pipefail, so `| tee` keeps Terraform's exit code
        run: terraform destroy -auto-approve -input=false -no-color 2>&1 | tee destroy.log

      - name: Report Terraform errors
        if: failure()
        working-directory: terraform
        run: |
          [ -f destroy.log ] || exit 0
          awk '{ gsub(/%/, "%25") }
               /^Error: / { if (buf) print buf; buf = $0; n = 0; next }
               buf && n < 15 { buf = buf "%0A" $0; n++ }
               END { if (buf) print buf }' destroy.log |
            while IFS= read -r block; do echo "::error title=Terraform (destroy.log)::${block}"; done

      - name: Summary
        run: |
          echo "### Stack destroyed :wastebasket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Recreate it with **Actions → CI-CD → Run workflow** on \`main\`." >> "$GITHUB_STEP_SUMMARY"
